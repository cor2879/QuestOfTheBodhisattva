name: Browser build and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: '6.0.10'
          actions-cache-folder: emsdk-cache
      - name: Compile native game and standalone HTML
        run: |
          rm -f native/web/quest.js
          python3 tools/build.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install browser checks
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Test Fortune Teller, native world, Haven, and sanctuary
        run: npm test
      - name: Stage GitHub Pages site
        run: python3 tools/stage-pages.py
      - name: Test published layout and relative URLs
        run: npm run test:pages
      - name: Keep downloadable offline build
        uses: actions/upload-artifact@v4
        with:
          name: quest-bodhisattva-offline
          path: play.html
          retention-days: 14
      - name: Configure Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload Pages site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/pages

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish tested game
        id: deployment
        uses: actions/deploy-pages@v4
